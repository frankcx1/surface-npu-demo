# industry.yaml -- Public Sector
# Schema for the industry-packs configuration layer.
# Status: stub -- all prompts are placeholders, not yet authored.

schema_version: 1

industry_id: public-sector
display_name: "Public Sector"
status: stub

# ---------------------------------------------------------------------------
# Vocabulary -- 10 tokens that the prompt layer interpolates everywhere
# ---------------------------------------------------------------------------
vocabulary:
  subject: "constituent"
  subject_plural: "constituents"
  practitioner: "analyst"
  practitioner_plural: "analysts"
  engagement: "request"
  engagement_plural: "requests"
  record: "case"
  records_system: "case management"
  organization: "agency"
  catalog_item: "service"

# ---------------------------------------------------------------------------
# Compliance
# ---------------------------------------------------------------------------
compliance:
  regimes:
    - FedRAMP
    - FISMA
  primary_safety_gate: passthrough          # stub -- no gate logic yet
  required_disclosures:
    - "All processing occurs on-device. No constituent data leaves this machine."

# ---------------------------------------------------------------------------
# Integrations
# ---------------------------------------------------------------------------
integrations:
  records_system:
    name: ServiceNow
    alternates:
      - Salesforce Gov
      - Microsoft Dynamics
  identity:
    name: null                              # stub -- no identity provider yet
  productivity:
    name: "Microsoft 365"

# ---------------------------------------------------------------------------
# Concierge
# ---------------------------------------------------------------------------
concierge:
  enabled: true
  # Priority convention: 0 = highest (like P0/P1 severity)
  tiers:
    - id: priority
      label: "Priority"
      priority: 0
      description: "Urgent constituent matters requiring immediate attention"
    - id: scheduled
      label: "Scheduled"
      priority: 1
      description: "Pre-scheduled appointments and follow-ups"
    - id: walk_in
      label: "Walk-In"
      priority: 2
      description: "Unscheduled visitors to the office"
    - id: general
      label: "General Inquiry"
      priority: 3
      description: "Phone, email, and portal inquiries"
  greeting_prompt_id: concierge_greeting_brief

# ---------------------------------------------------------------------------
# Tabs -- maps the 6 canonical tab slots to industry-appropriate labels
# ---------------------------------------------------------------------------
tabs:
  chat:
    name: "Mission Assistant"
    sub: "Knowledge & Tools"
  day:
    name: "Daily Briefing"
    sub: "Daily Prep"
  auditor:
    name: "CUI Guard"
    sub: "Compliance Check"
  id:
    name: "Credential Verify"
    sub: "Scan & Validate"
  live:
    name: "Constituent Interview"
    sub: "Real-Time AI Assist"
  field:
    name: "Engagement Notes"
    sub: "Post-Meeting Workflow"

