# industry.yaml -- Education
# Schema for the industry-packs configuration layer.
# Status: stub -- all prompts are placeholders, not yet authored.

schema_version: 1

industry_id: education
display_name: "Education"
status: stub

# ---------------------------------------------------------------------------
# Vocabulary -- 10 tokens that the prompt layer interpolates everywhere
# ---------------------------------------------------------------------------
vocabulary:
  subject: "student"
  subject_plural: "students"
  practitioner: "faculty"
  practitioner_plural: "faculty"
  engagement: "appointment"
  engagement_plural: "appointments"
  record: "file"
  records_system: "SIS"
  organization: "department"
  catalog_item: "course"

# ---------------------------------------------------------------------------
# Compliance
# ---------------------------------------------------------------------------
compliance:
  regimes:
    - FERPA
  primary_safety_gate: passthrough          # stub -- no gate logic yet
  required_disclosures:
    - "All processing occurs on-device. No student data leaves this machine."

# ---------------------------------------------------------------------------
# Integrations
# ---------------------------------------------------------------------------
integrations:
  records_system:
    name: Ellucian Banner
    alternates:
      - Workday Student
      - PowerSchool
  identity:
    name: null                              # stub -- no identity provider yet
  productivity:
    name: "Microsoft 365"

# ---------------------------------------------------------------------------
# Concierge
# ---------------------------------------------------------------------------
concierge:
  enabled: true
  # Priority convention: 0 = highest (like P0/P1 severity)
  tiers:
    - id: priority
      label: "Priority"
      priority: 0
      description: "Urgent student situations requiring immediate faculty attention"
    - id: scheduled
      label: "Scheduled"
      priority: 1
      description: "Pre-scheduled advising appointments"
    - id: walk_in
      label: "Walk-In"
      priority: 2
      description: "Drop-in office hours and unscheduled visits"
  greeting_prompt_id: concierge_greeting_brief

# ---------------------------------------------------------------------------
# Tabs -- maps the 6 canonical tab slots to industry-appropriate labels
# ---------------------------------------------------------------------------
tabs:
  chat:
    name: "Faculty Assistant"
    sub: "Knowledge & Tools"
  day:
    name: "Daily Briefing"
    sub: "Daily Prep"
  auditor:
    name: "FERPA Guard"
    sub: "Compliance Check"
  id:
    name: "Student ID & Records"
    sub: "Scan & Validate"
  live:
    name: "Advising Assist"
    sub: "Real-Time AI Assist"
  field:
    name: "Advising Notes"
    sub: "Post-Session Workflow"

