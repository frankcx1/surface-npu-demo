# industry.yaml -- Manufacturing
# Schema for the industry-packs configuration layer.
# Status: stub -- all prompts are placeholders, not yet authored.

schema_version: 1

industry_id: manufacturing
display_name: "Manufacturing"
status: stub

# ---------------------------------------------------------------------------
# Vocabulary -- 10 tokens that the prompt layer interpolates everywhere
# ---------------------------------------------------------------------------
vocabulary:
  subject: "operator"
  subject_plural: "operators"
  practitioner: "engineer"
  practitioner_plural: "engineers"
  engagement: "inspection"
  engagement_plural: "inspections"
  record: "work order"
  records_system: "MES"
  organization: "plant"
  catalog_item: "specification"

# ---------------------------------------------------------------------------
# Compliance
# ---------------------------------------------------------------------------
compliance:
  regimes:
    - NIST_800_171
    - ISO_27001
  primary_safety_gate: passthrough          # stub -- no gate logic yet
  required_disclosures:
    - "All processing occurs on-device. No production data leaves this machine."

# ---------------------------------------------------------------------------
# Integrations
# ---------------------------------------------------------------------------
integrations:
  records_system:
    name: SAP
    alternates:
      - Oracle
      - Siemens Opcenter
  identity:
    name: null                              # stub -- no identity provider yet
  productivity:
    name: "Microsoft 365"

# ---------------------------------------------------------------------------
# Concierge
# ---------------------------------------------------------------------------
concierge:
  enabled: true
  # Priority convention: 0 = highest (like P0/P1 severity)
  tiers:
    - id: priority
      label: "Priority"
      priority: 0
      description: "Critical safety or line-down issues requiring immediate response"
    - id: scheduled
      label: "Scheduled"
      priority: 1
      description: "Pre-scheduled inspections and maintenance windows"
    - id: walk_in
      label: "Walk-In"
      priority: 2
      description: "Unscheduled floor visits and ad-hoc requests"
  greeting_prompt_id: concierge_greeting_brief

# ---------------------------------------------------------------------------
# Tabs -- maps the 6 canonical tab slots to industry-appropriate labels
# ---------------------------------------------------------------------------
tabs:
  chat:
    name: "Operator Assistant"
    sub: "Knowledge & Tools"
  day:
    name: "Shift Briefing"
    sub: "Daily Prep"
  auditor:
    name: "Spec / Export Review"
    sub: "Compliance Check"
  id:
    name: "Asset & Spec Verify"
    sub: "Scan & Validate"
  live:
    name: "Floor / Inspection Assist"
    sub: "Real-Time AI Assist"
  field:
    name: "Inspection Notes"
    sub: "Post-Inspection Workflow"

