# Personas
# ---------------------------------------------------------------------------
personas:
  allowlist: []
  default: null

# ---------------------------------------------------------------------------
# PII -- demo-safe person names
# ---------------------------------------------------------------------------
pii:
  demo_person_names:
    - "Demo Person"

# ---------------------------------------------------------------------------
# Catalog
# ---------------------------------------------------------------------------
catalog:
  schema_version: 2
  taxonomy: "retail-skus"
  groups:
    - placeholder

# ---------------------------------------------------------------------------
# Demo data
