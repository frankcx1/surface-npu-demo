# industry.yaml -- Retail
# Schema for the industry-packs configuration layer.
# Status: stub -- all prompts are placeholders, not yet authored.

schema_version: 1

industry_id: retail
display_name: "Retail"
status: stub

# ---------------------------------------------------------------------------
# Vocabulary -- 10 tokens that the prompt layer interpolates everywhere
# ---------------------------------------------------------------------------
vocabulary:
  subject: "customer"
  subject_plural: "customers"
  practitioner: "associate"
  practitioner_plural: "associates"
  engagement: "transaction"
  engagement_plural: "transactions"
  record: "order"
  records_system: "POS"
  organization: "store"
  catalog_item: "SKU"

# ---------------------------------------------------------------------------
# Compliance
# ---------------------------------------------------------------------------
compliance:
  regimes:
    - PCI_DSS
  primary_safety_gate: passthrough          # stub -- no gate logic yet
  required_disclosures:
    - "All processing occurs on-device. No customer data leaves this machine."

# ---------------------------------------------------------------------------
# Integrations
# ---------------------------------------------------------------------------
integrations:
  records_system:
    name: Shopify
    alternates:
      - Oracle Retail
      - SAP
  identity:
    name: null                              # stub -- no identity provider yet
  productivity:
    name: "Microsoft 365"

# ---------------------------------------------------------------------------
# Concierge
# ---------------------------------------------------------------------------
concierge:
  enabled: true
  # Priority convention: 0 = highest (like P0/P1 severity)
  tiers:
    - id: vip
      label: "VIP"
      priority: 0
      description: "High-value customers with concierge-level service"
    - id: loyalty
      label: "Loyalty Member"
      priority: 1
      description: "Enrolled loyalty program members"
    - id: walk_in
      label: "Walk-In"
      priority: 2
      description: "General foot traffic and new visitors"
  greeting_prompt_id: concierge_greeting_brief

# ---------------------------------------------------------------------------
# Tabs -- maps the 6 canonical tab slots to industry-appropriate labels
# ---------------------------------------------------------------------------
tabs:
  chat:
    name: "Associate Assistant"
    sub: "Knowledge & Tools"
  day:
    name: "Shift Briefing"
    sub: "Daily Prep"
  auditor:
    name: "Cardholder Data Guard"
    sub: "Compliance Check"
  id:
    name: "Returns & Age Verify"
    sub: "Scan & Validate"
  live:
    name: "Clienteling Assist"
    sub: "Real-Time AI Assist"
  field:
    name: "Visit Notes"
    sub: "Post-Visit Workflow"

