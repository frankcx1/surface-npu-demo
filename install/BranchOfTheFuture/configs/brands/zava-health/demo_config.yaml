demo_script:
  - {delay: 0,    speaker: "Patient",    text: "Hi Dr. Patel, I'm here for my annual checkup."}
  - {delay: 3500, speaker: "Clinician",  text: "Hi Jordan, good to see you again. How have you been since your last visit?"}
  - {delay: 3500, speaker: "Patient",    text: "Pretty good overall. I've been trying to eat better and walk more."}
  - {delay: 3000, speaker: "Clinician",  text: "That's great to hear. Any new concerns or symptoms since we last met?"}
  - {delay: 3500, speaker: "Patient",    text: "My energy has been low lately. I'm sleeping enough but still feel tired."}
  - {delay: 4000, speaker: "Patient",    text: "Also, I noticed I'm getting up at night to use the bathroom more than usual."}
  - {delay: 3000, speaker: "Clinician",  text: "That's helpful to know. Both of those can be worth checking into. How long has this been going on?"}
  - {delay: 3500, speaker: "Patient",    text: "Maybe two or three months? I wasn't sure if it was worth mentioning."}
  - {delay: 3000, speaker: "Patient",    text: "My A1C was borderline last time. Should I be worried?"}
  - {delay: 3500, speaker: "Clinician",  text: "It's smart to bring it up. We'll check your A1C again today and compare to last year."}
  - {delay: 4000, speaker: "Patient",    text: "My mom was just diagnosed with type 2 diabetes. That kind of got me thinking about it."}
  - {delay: 3000, speaker: "Patient",    text: "Is there anything I should be doing differently right now?"}
  - {delay: 3500, speaker: "Clinician",  text: "Family history is definitely a factor. We'll review your labs and talk about a plan that works for you."}
  - {delay: 3500, speaker: "Patient",    text: "I'm also due for some screenings, right? I think I got a letter about that."}
  - {delay: 4000, speaker: "Patient",    text: "And I want to make sure I'm up to date on vaccinations before my daughter starts college."}
  - {delay: 3000, speaker: "Clinician",  text: "Yes, we'll go through the preventive care checklist today. Good timing."}
  - {delay: 3500, speaker: "Patient",    text: "OK, that sounds good. I want to be proactive about all of this."}
  - {delay: 3000, speaker: "Patient",    text: "Can we also talk about whether I should see a nutritionist? My insurance might cover it."}
  - {delay: 3500, speaker: "Clinician",  text: "Absolutely. I'll put in a referral today and we'll check your coverage. Let's start with vitals."}

